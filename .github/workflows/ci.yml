name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: pip install ruff==0.15.17
      - name: Static correctness checks
        run: ruff check --select F,E9 backend tests

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: issuetracker
          POSTGRES_PASSWORD: issuetracker
          POSTGRES_DB: issuetracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U issuetracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: pip install -r backend/requirements-dev.txt
      - name: Run API tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://issuetracker:issuetracker@localhost:5432/issuetracker
        run: pytest tests/api

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build
      - name: Start services and run UI tests
        env: {JWT_SECRET: ci-only-secret}
        run: |
          (cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000 &)
          (cd frontend && npx vite preview --port 5173 --host 127.0.0.1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          pytest tests/ui

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
