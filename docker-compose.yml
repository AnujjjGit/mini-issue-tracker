name: issue-tracker
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: issuetracker
      POSTGRES_PASSWORD: issuetracker
      POSTGRES_DB: issuetracker
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuetracker -d issuetracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://issuetracker:issuetracker@db:5432/issuetracker
      JWT_SECRET: docker-compose-demo-secret-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  pgdata:
